<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>select region</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Transparent window over the live desktop: no frozen screenshot sits behind
         this veil, so the human sees the real screen while dragging. */
      background: transparent;
      cursor: crosshair;
      -webkit-user-select: none;
      user-select: none;
      font: 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    /* A light veil: enough to read the marquee against, faint enough to keep the
       desktop underneath legible. */
    #veil {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.18);
      pointer-events: none;
    }
    #selection {
      position: absolute;
      display: none;
      border: 1px solid #5b86ff;
      background: transparent;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.18);
      pointer-events: none;
    }
    #hint {
      position: fixed;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      pointer-events: none;
      white-space: nowrap;
    }
    #size {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      padding: 5px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      pointer-events: none;
      opacity: 0;
      font-variant-numeric: tabular-nums;
    }
    #size.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="veil"></div>
  <div id="selection"></div>
  <div id="hint">拖动鼠标框选区域 · Esc 或右键取消</div>
  <div id="size"></div>
  <script src="overlay.js"></script>
</body>
</html>
