<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data:; style-src 'unsafe-inline'; script-src 'self'" />
  <title>ask about capture</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #e9e9ec;
    }
    #card {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 14px;
      border-radius: 12px;
      background: rgba(24, 24, 28, 0.975);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-app-region: drag;
    }
    #head { display: flex; align-items: center; gap: 10px; }
    #thumb {
      width: 96px;
      height: 54px;
      object-fit: contain;
      background: #0d0d10;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      flex: 0 0 auto;
    }
    #headText { flex: 1 1 auto; min-width: 0; }
    #title { font-weight: 600; }
    #path {
      opacity: 0.62;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      direction: rtl;
      text-align: left;
    }
    #question {
      box-sizing: border-box;
      width: 100%;
      flex: 1 1 auto;
      min-height: 62px;
      resize: none;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(0, 0, 0, 0.3);
      color: inherit;
      font: inherit;
      -webkit-app-region: no-drag;
    }
    #question:focus { outline: none; border-color: #5b86ff; }
    #row { display: flex; align-items: center; gap: 8px; }
    button {
      -webkit-app-region: no-drag;
      padding: 7px 14px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    button:hover { border-color: rgba(255, 255, 255, 0.36); }
    button:disabled { opacity: 0.5; cursor: default; }
    #submit {
      border: none;
      background: #4f7cff;
      color: #fff;
      font-weight: 600;
    }
    #status { margin-left: auto; font-size: 12px; opacity: 0.8; text-align: right; }
    #status.error { color: #ffb1b1; opacity: 1; }
    #status.warn { color: #ffd79a; opacity: 1; }
  </style>
</head>
<body>
  <div id="card">
    <div id="head">
      <img id="thumb" alt="" />
      <div id="headText">
        <div id="title">截图已保存 · 输入问题后回车提交给 DSH</div>
        <div id="path"></div>
      </div>
    </div>
    <textarea id="question" placeholder="想问什么？（留空则只发图片；Enter 提交，Shift+Enter 换行）"></textarea>
    <div id="row">
      <button id="submit">提交给 DSH</button>
      <button id="folder">打开图片目录</button>
      <button id="cancel">取消 (Esc)</button>
      <div id="status"></div>
    </div>
  </div>
  <script src="ask.js"></script>
</body>
</html>
